; Optional per-provider editor completion list (does not change inference):
; direction_tags = ["proud", "Scottish accent"]
; Blank uses built-in examples; [] intentionally hides suggestions.

[provider:fish-s21-free]
label = Fish Audio (free)
engine = fish
transport = cloud
endpoint = https://api.fish.audio
model = s2.1-pro-free
syntax = brackets
capabilities = references,speed,directions

[provider:fish-cloud]
label = Fish Audio — cloud
engine = fish
transport = cloud
endpoint = https://api.fish.audio
model = drama-3
voice =
api_key_env = FISH_API_KEY
syntax = brackets
timeout = 180
capabilities = directions,speed,timestamps

[provider:elevenlabs]
label = ElevenLabs — cloud
engine = elevenlabs
transport = cloud
endpoint = https://api.elevenlabs.io
model = eleven_v3
voice =
api_key_env = ELEVENLABS_API_KEY
syntax = brackets
timeout = 180
capabilities = directions,timestamps,seed

[provider:openai]
label = OpenAI — cloud
engine = openai
transport = cloud
endpoint = https://api.openai.com
model = gpt-4o-mini-tts
voice = alloy
api_key_env = OPENAI_API_KEY
syntax = instructions
timeout = 180
capabilities = directions,speed

[provider:azure]
label = Azure Speech — cloud
engine = azure
transport = cloud
endpoint = https://eastus.tts.speech.microsoft.com
model =
voice = en-US-JennyNeural
language = en-US
api_key_env = AZURE_SPEECH_KEY
syntax = ssml
timeout = 180
capabilities = ssml,speed

[provider:google]
label = Google Cloud TTS
engine = google
transport = cloud
endpoint = https://texttospeech.googleapis.com
voice = en-US-Neural2-F
language = en-US
api_key_env = GOOGLE_TTS_API_KEY
syntax = ssml
timeout = 180
capabilities = ssml,speed

[provider:polly]
label = Amazon Polly
engine = polly
transport = cloud
model = neural
voice = Joanna
region = us-east-1
aws_profile = default
syntax = ssml
timeout = 180
capabilities = ssml,speech_marks


; Optional local forced alignment. No weights are downloaded automatically.
[alignment]
engine = auto
python =
model_path =
device = cpu
language = English
timeout = 300

; Optional default CPU phone alignment profile.
; Set local paths using third_party/pocketsphinx.md.
[phoneme_alignment]
executable =
acoustic_model =
dictionary =
profile_id =
language = en-US
phone_set = ARPAbet
inference_lease =

; For other locales add [phoneme_alignment:<locale>] with the same paths,
; profile_id, phone_set, and (on a shared host) inference_lease.
